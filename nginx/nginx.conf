###############################################################################
# ThreatPulse Intel — Nginx main configuration
###############################################################################
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    # ── Performance ───────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 25m;   # allow CSV/JSON threat uploads

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        font/woff2
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # ── Upstream (Next.js standalone app) ────────────────────────────────────
    # NOTE: We deliberately do NOT use an `upstream {}` block here. nginx
    # resolves upstream hostnames only once at startup and caches the IP
    # forever. When `make update` recreates the `app` container it gets a NEW
    # docker network IP, and nginx keeps dialing the old (dead) one -> 502
    # "connect() failed (111: Connection refused)". Instead we point proxy_pass
    # at the `app` hostname via a variable + Docker's embedded DNS resolver
    # (127.0.0.11), which forces nginx to re-resolve at request time. See the
    # site template for the actual proxy_pass directives.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket upgrade mapping (Next.js HMR / any realtime).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
