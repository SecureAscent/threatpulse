###############################################################################
# ThreatPulse Intel — PRODUCTION stack
#
#   postgres  : database (internal only, named volume, healthcheck)
#   app       : Next.js 14 application (standalone), migrated + seeded on boot
#   collector : intelligence collection worker (KEV / NVD / RSS every 15m)
#   nginx     : TLS-terminating reverse proxy (ports 80 + 443)
#   certbot   : Let's Encrypt certificate issuance / renewal
#
# Usage:
#   make setup       # create .env.prod
#   # edit .env.prod (domain, secrets)
#   make ssl         # obtain certificates
#   make up          # start the stack
#   make create-admin
#
# Env is read from .env.prod (see .env.prod.example).
###############################################################################

services:
  # ── PostgreSQL (internal only — never published to the host) ───────────────
  postgres:
    image: postgres:15-alpine
    container_name: threatpulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threatpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-threatpulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threatpulse} -d ${POSTGRES_DB:-threatpulse}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - threatpulse-net
    # NOTE: intentionally no `ports:` — Postgres is reachable only on the
    # internal docker network by app + collector.

  # ── Next.js application ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXTAUTH_URL: ${NEXTAUTH_URL:-https://localhost}
        NEXT_PUBLIC_APP_URL: ${NEXTAUTH_URL:-https://localhost}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ThreatPulse Intel}
    image: threatpulse-app:latest
    container_name: threatpulse-app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-threatpulse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-threatpulse}?connect_timeout=15
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - threatpulse-net
    # App is NOT published to the host; nginx proxies to it internally.
    expose:
      - "3000"

  # ── Intelligence collector worker ──────────────────────────────────────────
  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    image: threatpulse-collector:latest
    container_name: threatpulse-collector
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-threatpulse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-threatpulse}?connect_timeout=15
      COLLECTOR_INTERVAL_MINUTES: ${COLLECTOR_INTERVAL_MINUTES:-15}
      COLLECTOR_ORG_SLUG: ${COLLECTOR_ORG_SLUG:-threatpulse-demo}
      NVD_API_KEY: ${NVD_API_KEY:-}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - threatpulse-net

  # ── Nginx reverse proxy (TLS termination) ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: threatpulse-nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Substituted into the server block at startup (see command below).
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Templates are rendered into the container's own /etc/nginx/conf.d at
      # startup — we mount the template dir read-only, NOT conf.d.
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - threatpulse-net
    # 1. Render the site config from the template, substituting ONLY ${DOMAIN}
    #    (nginx $vars are preserved). This runs fresh every start, so git
    #    pull/reset can never leave a stale __DOMAIN__ placeholder behind.
    # 2. Reload nginx every 6h so renewed certificates are picked up.
    command: >-
      /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf;
      envsubst '$${DOMAIN}' < /etc/nginx/templates/threatpulse.conf.template > /etc/nginx/conf.d/threatpulse.conf;
      (while :; do sleep 6h & wait $${!}; nginx -s reload; done &)
      nginx -g 'daemon off;'"

  # ── Certbot (Let's Encrypt) ────────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: threatpulse-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Auto-renew twice a day; nginx picks up new certs on its reload loop.
    entrypoint: >-
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    restart: unless-stopped
    networks:
      - threatpulse-net

volumes:
  pgdata:
    driver: local

networks:
  threatpulse-net:
    driver: bridge
