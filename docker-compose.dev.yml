###############################################################################
# ThreatPulse Intel — DEVELOPMENT stack (no SSL / nginx)
#
#   postgres  : exposed on localhost:5432 for local tooling (psql, GUIs)
#   app       : Next.js dev server with hot reload on http://localhost:3000
#   collector : intelligence worker (tsx watch — restarts on code changes)
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
# Source is bind-mounted, so edits on the host reload instantly.
# node_modules live in named volumes so host/container arch differences
# don't collide.
###############################################################################

services:
  postgres:
    image: postgres:15-alpine
    container_name: threatpulse-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threatpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threatpulse_secret}
      POSTGRES_DB: ${POSTGRES_DB:-threatpulse}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threatpulse} -d ${POSTGRES_DB:-threatpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - threatpulse-dev-net

  app:
    image: node:20-alpine
    container_name: threatpulse-app-dev
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-threatpulse}:${POSTGRES_PASSWORD:-threatpulse_secret}@postgres:5432/${POSTGRES_DB:-threatpulse}?connect_timeout=15
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-not-for-production}
      NODE_ENV: development
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./nextjs_space:/app
      - app_node_modules:/app/node_modules
    command: >-
      sh -c "apk add --no-cache openssl libc6-compat &&
             yarn install &&
             npx prisma generate &&
             npx prisma db push --skip-generate &&
             (node -e \"const {PrismaClient}=require('@prisma/client');const p=new PrismaClient();p.user.count().then(c=>{if(c===0){process.exit(42)}else{process.exit(0)}}).catch(()=>process.exit(42))\" && echo 'DB already seeded' || (echo 'Seeding...' && npx tsx scripts/seed.ts)) ;
             yarn dev -H 0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - threatpulse-dev-net

  collector:
    image: node:20-alpine
    container_name: threatpulse-collector-dev
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-threatpulse}:${POSTGRES_PASSWORD:-threatpulse_secret}@postgres:5432/${POSTGRES_DB:-threatpulse}?connect_timeout=15
      COLLECTOR_INTERVAL_MINUTES: ${COLLECTOR_INTERVAL_MINUTES:-15}
      COLLECTOR_ORG_SLUG: ${COLLECTOR_ORG_SLUG:-threatpulse-demo}
      NVD_API_KEY: ${NVD_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      NODE_ENV: development
    volumes:
      - ./collector:/app
      - collector_node_modules:/app/node_modules
    command: >-
      sh -c "apk add --no-cache openssl &&
             npm install &&
             npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - threatpulse-dev-net

volumes:
  pgdata_dev:
  app_node_modules:
  collector_node_modules:

networks:
  threatpulse-dev-net:
    driver: bridge
