name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/organization-tenancy-hardening

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: nextjs_space
    env:
      DATABASE_URL: postgresql://threatpulse:threatpulse@localhost:5432/threatpulse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-not-for-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: nextjs_space/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate Prisma schema
        run: yarn prisma validate --schema=./prisma/schema.prisma

      - name: Generate Prisma client
        run: yarn db:generate

      - name: Run tenancy tests
        run: yarn test:tenancy

      - name: Type-check application
        run: yarn tsc --noEmit

      - name: Build application
        run: yarn build

  collector:
    name: Collector validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: collector
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: collector/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check collector
        run: npm run typecheck

      - name: Build collector
        run: npm run build

  shell-safety:
    name: Shell script syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate operational scripts
        run: |
          bash -n scripts/repair-organization-schema.sh
          bash -n docker/docker-entrypoint.sh
